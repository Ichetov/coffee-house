<div class="modal" hidden>
  <div class="modal__backdrop"></div>

  <div
    class="modal__content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <img class="modal__image" src="" alt="">

    <div class="modal__info">

      <h2 class="modal__title" id="modal-title"></h2>

      <p class="modal__description"></p>

      <div class="modal__size-group">
        <p class="modal__label">Size</p>

        <div class="modal__sizes">
          <button
            type="button"
            class="modal__item modal__item--active"
            data-size="s"
            aria-pressed="true"
          >
            <span class="modal__wrap">S</span>
            <span class="modal__text"></span>
          </button>

          <button
            type="button"
            class="modal__item"
            data-size="m"
            aria-pressed="false"
          >
            <span class="modal__wrap">M</span>
            <span class="modal__text"></span>
          </button>

          <button
            type="button"
            class="modal__item"
            data-size="l"
            aria-pressed="false"
          >
            <span class="modal__wrap">L</span>
            <span class="modal__text"></span>
          </button>
        </div>
      </div>

      <div class="modal__additives-group">
        <p class="modal__label">Additives</p>

        <div class="modal__additives">
          <button
            type="button"
            class="modal__item"
            data-additive="0"
            aria-pressed="false"
          >
            <span class="modal__wrap">1</span>
            <span class="modal__text"></span>
          </button>

          <button
            type="button"
            class="modal__item"
            data-additive="1"
            aria-pressed="false"
          >
            <span class="modal__wrap">2</span>
            <span class="modal__text"></span>
          </button>

          <button
            type="button"
            class="modal__item"
            data-additive="2"
            aria-pressed="false"
          >
            <span class="modal__wrap">3</span>
            <span class="modal__text"></span>
          </button>
        </div>
      </div>

      <div class="modal__total">
        <span class="modal__total-label">Total:</span>
        <span class="modal__price"></span>
      </div>

      <button class="modal__close" type="button">
        Close
      </button>

    </div>
  </div>
